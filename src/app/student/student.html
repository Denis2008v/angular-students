@for(item of students; track $index) {
    <p [ngStyle]="{'backgroundColor': item.gender == 'F' ? F_COLOR : M_COLOR}"
    [ngClass]="{'absent': !item.present}">
        {{$index +1}})  {{ item.name }} di {{ item.city }} è 
        @if (item.present)
        {<span>PRESENTE</span>} 
        @else 
        { <span style="text-transform: uppercase;">ASSENTE</span> } </p>
}
